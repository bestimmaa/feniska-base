# Feniska Base (LILYGO TTGO T-Display V1.1 + HX711) -> ESPHome draft
# Derived from reverse-engineering the original firmware v16 (see re/FINDINGS.md).
# CONFIRMED = seen in original firmware code; INFERRED/UNCONFIRMED = check on hardware.
#
# Flash-size note: the device's partition table has two 1.25 MB app slots (0x140000).
# If you OTA this via the original firmware's /update endpoint, the ESPHome
# firmware.ota.bin MUST be < 1,310,720 bytes. esp-idf framework keeps the image small.

substitutions:
  name: feniska-base
  friendly_name: Feniska Base
  # EXAMPLE VALUES - replace with your own base's calibration (see README "Calibration").
  # Each base stores its factory values in NVS (namespace "feniska", keys calibFac / calibOff).
  calib_fac: "24.0"        # raw counts per gram; your base's calibFac or a fresh recalibration (typically ~24)
  # Visit detection: anything heavier than this counts as a cat (a visit). If all your cats are
  # well above it, raise it (e.g. 2.0) so a cat with only its front paws on the rim doesn't count.
  visit_min_kg: "1.0"
  # A visit ends after this many samples (~1/s) below visit_min_kg. Long enough that a cat stepping
  # half out and back in stays one visit.
  visit_end_samples: "10"
  # Boot splash on the display (240x135). Make your own with re/scripts/make_splash.py, e.g. with
  # your cats' faces, and point splash_file at it from your local override (keep photos *.local.*).
  splash_file: "assets/splash.png"
  splash_seconds: "6"
  calib_off: "430000"      # raw reading of the empty base; only a start value, the scale re-tares at boot

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Shown in Home Assistant as the device's firmware version. Bump it with every config change
  # that gets flashed, and tag the commit (v<version>). See README "Firmware versions".
  project:
    name: "bestimmaa.feniska-base"
    version: "1.2.0"

esp32:
  board: esp32dev          # TTGO T-Display V1.1, ESP32-D0WDQ6-V3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret feniska_api_key

ota:
  - platform: esphome
    password: !secret feniska_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Feniska-Base Fallback"
    password: !secret feniska_ap_password

captive_portal:

# Local REST/web UI, e.g. tare from a terminal:
#   curl -X POST -d '' http://feniska-base.local/button/Tare/press   (name-based, case-sensitive)
web_server:
  port: 80
  version: 3

globals:
  - id: zero_offset          # HX711 offset (raw counts). Original keeps it in RAM only.
    type: float
    restore_value: false
    initial_value: ${calib_off}
  - id: tare_pending         # original firmware tares at every boot (read_average(10) after 300 ms)
    type: bool
    restore_value: false
    initial_value: "true"

spi:
  clk_pin: GPIO18            # INFERRED (standard T-Display; TFT_eSPI SPI.begin)
  mosi_pin: GPIO19           # INFERRED (standard T-Display)

output:
  - platform: ledc           # CONFIRMED: ledcSetup(ch1, 12000 Hz, 8 bit), ledcAttachPin(GPIO4)
    id: backlight_pwm
    pin: GPIO4
    frequency: 12000Hz

light:
  - platform: monochromatic
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON   # original: full brightness (255) at boot
    default_transition_length: 0s

image:
  - file: ${splash_file}
    id: splash
    type: RGB565
    resize: 240x135

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 44
  - file: "gfonts://Roboto"
    id: font_small
    size: 18

display:
  # ST7789 135x240. CONFIRMED pins: CS=5, DC=16, RST=23, BL=4 (BL driven by the ledc light above).
  # mipi_spi's T-DISPLAY preset already knows the panel offsets. If your ESPHome version
  # complains that GPIO4 is used twice (preset backlight vs. ledc), drop the light/output
  # above and let the preset drive the backlight (or vice versa).
  - platform: mipi_spi
    model: T-DISPLAY
    id: tft
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    rotation: 90             # original: TFT_eSPI setRotation(1) = landscape 240x135
    update_interval: 1s
    lambda: |-
      // Boot splash (NOT original): shown for the first splash_seconds after a restart.
      if (millis() < ${splash_seconds} * 1000UL) {
        it.image(0, 0, id(splash));
        return;
      }
      // Original: weight >= 0.1 kg -> big "x.xx" + "kg"; else idle screen. Values in
      // (-0.05, 0.05) or negative are shown as 0.
      float kg = id(weight_display).state;
      if (!std::isnan(kg) && kg >= 0.1f) {
        it.printf(15, 40, id(font_big), "%.2f", kg);
        it.print(170, 60, id(font_small), "kg");
      } else {
        it.print(15, 40, id(font_small), "Feniska Base");
        it.printf(15, 70, id(font_small), "WiFi: %s", id(wifi_ip).state.c_str());
      }

time:
  - platform: sntp
    id: sntp_time

text_sensor:
  - platform: template
    id: last_visit_time
    name: "Last Visit Time"
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true

sensor:
  - platform: hx711
    id: hx_raw
    name: "HX711 Raw"
    internal: true
    dout_pin:
      number: GPIO15         # CONFIRMED: HX711::begin(dataPin=15, clockPin=2)  (NOT 32/33!)
      ignore_strapping_warning: true
    clk_pin:
      number: GPIO2          # CONFIRMED
      ignore_strapping_warning: true
    gain: 128                # CONFIRMED (channel A, never changed)
    # Original: get_units(10) in MEDAVG mode (10 reads, average of middle 4) + 50 ms delay,
    # i.e. ~1 value/s at 10 SPS. ESPHome's hx711 does not wait for DOUT, so poll a bit
    # slower than the conversion rate (RATE pin of the board is UNCONFIRMED: 10 or 80 SPS).
    update_interval: 200ms
    filters:
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 5
    on_value:
      then:
        - lambda: |-
            const float calib_fac = ${calib_fac};   // counts per gram (sign +: raw rises with load)
            if (id(tare_pending)) {                  // boot / manual tare (original: RAM only)
              id(zero_offset) = x;
              id(tare_pending) = false;
            }
            float kg = (x - id(zero_offset)) / calib_fac / 1000.0f;  // CONFIRMED formula
            // Original zero tracking: |w| < 10 g -> offset = current raw.
            if (fabsf(kg) < 0.01f) id(zero_offset) = x;
            id(weight).publish_state(kg);
            // Display clamp (original FUN_400d4ea4): (-0.05,0.05) or negative -> 0.
            float disp = (kg < 0.05f) ? 0.0f : kg;
            if (std::isnan(id(weight_display).state) || fabsf(disp - id(weight_display).state) > 0.05f)
              id(weight_display).publish_state(disp);
            // Original upload decision (FUN_400d50c0): change > 20 g -> send now; 10 s after
            // the last change one settled value; then a heartbeat every 180 s.
            static float last_sent = -1.0f;
            static uint32_t last_ms = 0;
            static int state = 0;
            uint32_t now = millis();
            uint32_t dt = now - last_ms;
            bool push = false;
            if (fabsf(kg - last_sent) > 0.02f) { state = 0; push = true; }
            else if (state == 0 && dt > 10000) { state = 1; push = true; }
            else if (state >= 1 && dt > 180000) { state = 2; push = true; }
            if (push) {
              last_sent = kg; last_ms = now;
              id(weight_reported).publish_state(kg);
              id(raw_reported).publish_state(id(zero_offset) + kg * 1000.0f * calib_fac);
            }
            // Visit detection (NOT in the original firmware; the cloud did this). A visit
            // starts after 2 samples above visit_min_kg and ends after visit_end_samples
            // samples below it (~1 sample/s), so a cat that briefly steps half out and back
            // in stays one visit instead of being split. The cat's weight is the median of
            // the in-visit samples, which ignores the spikes of jumping in/out.
            // Baseline = the LOWEST sample of the ~30 s before the visit: the latest sample
            // would include a paw already resting on the box and make the cat read light.
            // Residue = weight 20 s after the visit ended.
            static std::vector<float> samples;
            static std::vector<float> pre;           // recent out-of-visit samples
            static int above = 0, below = 0;
            static bool in_visit = false;
            static uint32_t visit_start = 0, last_above = 0, residue_due = 0;
            static float visit_baseline = 0.0f;
            const float min_kg = ${visit_min_kg};
            if (kg > min_kg) { above++; below = 0; last_above = now; } else { below++; above = 0; }
            if (!in_visit && above >= 2) {
              in_visit = true; visit_start = now; residue_due = 0;
              visit_baseline = pre.empty() ? 0.0f : *std::min_element(pre.begin(), pre.end());
              samples.clear();
            }
            if (in_visit && kg > min_kg && samples.size() < 1800) samples.push_back(kg);
            if (in_visit && below >= ${visit_end_samples}) {
              in_visit = false;
              uint32_t secs = (last_above - visit_start) / 1000;
              if (secs >= 5 && !samples.empty()) {
                std::vector<float> s = samples;
                std::sort(s.begin(), s.end());
                id(last_visit_weight).publish_state(s[s.size() / 2] - visit_baseline);
                id(last_visit_peak).publish_state(s.back() - visit_baseline);
                id(last_visit_duration).publish_state(secs);
                id(visit_count).publish_state(std::isnan(id(visit_count).state) ? 1 : id(visit_count).state + 1);
                auto t = id(sntp_time).now();
                id(last_visit_time).publish_state(t.is_valid() ? t.strftime("%Y-%m-%d %H:%M:%S") : "unknown (no time sync)");
                residue_due = now + 20000;
              }
            }
            if (!in_visit) {
              if (residue_due != 0 && (int32_t)(now - residue_due) >= 0) {
                id(last_visit_residue).publish_state(kg - visit_baseline);
                residue_due = 0;
              }
              pre.push_back(kg);               // pre-visit reference window (~30 samples)
              if (pre.size() > 30) pre.erase(pre.begin());
            }

  - platform: template
    id: last_visit_weight
    name: "Last Visit Weight"
    unit_of_measurement: kg
    accuracy_decimals: 2
    device_class: weight
    state_class: measurement

  - platform: template
    id: last_visit_peak
    name: "Last Visit Peak"
    unit_of_measurement: kg
    accuracy_decimals: 2
    device_class: weight
    entity_category: diagnostic

  - platform: template
    id: last_visit_duration
    name: "Last Visit Duration"
    unit_of_measurement: s
    accuracy_decimals: 0
    device_class: duration

  - platform: template
    id: last_visit_residue
    name: "Last Visit Residue"
    unit_of_measurement: kg
    accuracy_decimals: 3
    device_class: weight

  - platform: template
    id: visit_count
    name: "Visits Since Boot"
    accuracy_decimals: 0
    state_class: total_increasing

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: template
    id: weight
    name: "Weight (live)"
    unit_of_measurement: kg
    accuracy_decimals: 3
    device_class: weight
    state_class: measurement
    # Live value about once a second. Throttle it if HA history gets too busy:
    filters:
      - throttle: 1s

  - platform: template
    id: weight_reported
    name: "Weight"
    unit_of_measurement: kg
    accuracy_decimals: 2
    device_class: weight
    state_class: measurement
    # Same cadence as the original cloud upload (event-driven + 3 min heartbeat).

  - platform: template
    id: raw_reported
    name: "Raw Value"        # equivalent of the original JSON "rawValue"
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: weight_display
    internal: true

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  # CONFIRMED: the original uses exactly one button, GPIO35 (double click 300 ms = display
  # demo; long press 5 s = wipe Wi-Fi + restart). GPIO35 is input-only with an external
  # pull-up on the T-Display, active low.
  - platform: gpio
    id: btn_right
    name: "Button"
    pin:
      number: GPIO35
      inverted: true
    filters:
      - delayed_on_off: 20ms   # original debounce 20 ms
    on_multi_click:
      - timing:                # double click -> tare (NOT original; original showed a demo)
          - ON for at most 0.5s
          - OFF for at most 0.3s
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - button.press: tare_button
      - timing:                # long press 5 s -> restart (original: wipe Wi-Fi creds + restart)
          - ON for at least 5s
        then:
          - button.press: restart_button
  # GPIO0 (left/BOOT button) is unused by the original firmware. Optional extra:
  # - platform: gpio
  #   name: "Button Left"
  #   pin: { number: GPIO0, inverted: true, mode: { input: true, pullup: true } }

button:
  - platform: template
    id: tare_button
    name: "Tare"
    on_press:
      - lambda: id(tare_pending) = true;   # original /tare and MQTT "tare": RAM-only re-zero
  - platform: restart
    id: restart_button
    name: "Restart"
